<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfabeto Strudel</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { display: flex; flex-direction: column; }

    /* barra in alto con tutte le lettere */
    #lettere { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
               gap: 10px; padding: 14px 16px; border-bottom: 1px solid #222; flex: none; }
    .lettera { background: none; border: none; padding: 4px; cursor: pointer; opacity: .35; line-height: 0; }
    .lettera:hover { opacity: .7; }
    .lettera.attiva { opacity: 1; }
    button:focus { outline: none; }
    .lettera canvas { display: block; image-rendering: pixelated; }

    /* pianoroll: tutto lo spazio sotto la barra, da bordo a bordo */
    #roll { flex: 1; width: 100%; min-height: 0; display: block; cursor: pointer; }

    #comandi { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    #comandi button { font: 14px monospace; color: #fff; background: #000; border: 1px solid #444;
                      padding: 6px 14px; cursor: pointer; opacity: .5; }
    #comandi button:hover { opacity: 1; }

    /* avviso di errore (file mancante o codice sbagliato) */
    #avviso { display: none; position: fixed; top: 100px; left: 50%; transform: translateX(-50%); white-space: pre-line;
              font: 13px monospace; color: #ff6b6b; background: #111; border: 1px solid #522; padding: 8px 12px; max-width: 80vw; }

    #editor, #test-canvas { display: none !important; }  /* editor di Strudel nascosto */
  </style>
</head>
<body>
  <nav id="lettere"></nav>
  <canvas id="roll"></canvas>
  <div id="comandi">
    <button id="toggle">▶ play</button>
    <button id="reset">↺ reset</button>
  </div>
  <div id="avviso"></div>
  <div id="editor"></div>

  <!-- Strudel (versione fissata, così il codice non si rompe con gli aggiornamenti) -->
  <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
  <!-- la pagina; forma e beat di ogni lettera sono in alphabet/a.js ... z.js -->
  <script src="script.js"></script>
</body>
</html>
